name = "sprea-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGIN = "https://sprea-frontend.suuu-sh.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "sprea-db"
