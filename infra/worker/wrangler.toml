name = "sprea-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGIN = "http://localhost:3000"

[[d1_databases]]
binding = "DB"
database_name = "sprea-db"
# `wrangler d1 create sprea-db` の出力で置き換える。
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Production では Cloudflare dashboard / `wrangler secret put` で設定する。
# INGEST_API_KEY = secret
