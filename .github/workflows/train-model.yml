name: Train and promote model
on:
  schedule: [{ cron: "0 18 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: train-model, cancel-in-progress: false }
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r ml/requirements.txt
      - run: npx wrangler d1 export DB --remote --output research.sql
      - run: sqlite3 research.db < research.sql
      - run: python ml/train.py --db research.db --out artifacts/candidate
      - name: Download incumbent metrics if present
        continue-on-error: true
        run: npx wrangler r2 object get sprea-models/models/current-metrics.json --file artifacts/incumbent.json --remote
      - id: gate
        continue-on-error: true
        run: python ml/promote.py --candidate artifacts/candidate/metrics.json --incumbent artifacts/incumbent.json
      - uses: actions/upload-artifact@v4
        with: { name: training-report, path: artifacts/candidate, retention-days: 30 }
      - name: Promote immutable candidate, then pointer
        if: steps.gate.outcome == 'success'
        run: |
          VERSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for FILE in model.txt metrics.json manifest.json; do npx wrangler r2 object put "sprea-models/models/${VERSION}/${FILE}" --file "artifacts/candidate/${FILE}" --remote; done
          cp artifacts/candidate/metrics.json /tmp/current-metrics.json
          printf '{"version":"%s","prefix":"models/%s"}\n' "$VERSION" "$VERSION" > /tmp/current.json
          npx wrangler r2 object put sprea-models/models/current-metrics.json --file /tmp/current-metrics.json --remote
          npx wrangler r2 object put sprea-models/models/current.json --file /tmp/current.json --remote
      - name: Audit promoted model in D1
        if: steps.gate.outcome == 'success'
        env: { MODEL_STATUS: promoted }
        run: |
          python - <<'PY'
          import json, os, pathlib
          version=f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          metrics=pathlib.Path("artifacts/candidate/metrics.json").read_text().replace("'", "''")
          sql=f"INSERT INTO research_model_runs(version,status,artifact_key,metrics_json,created_at,promoted_at) VALUES('{version}','promoted','models/{version}','{metrics}',datetime('now'),datetime('now')) ON CONFLICT(version) DO UPDATE SET status='promoted',metrics_json=excluded.metrics_json,promoted_at=excluded.promoted_at;"
          pathlib.Path("/tmp/model-audit.sql").write_text(sql)
          PY
          npx wrangler d1 execute DB --remote --file /tmp/model-audit.sql
      - name: Audit rejected model in D1
        if: steps.gate.outcome != 'success'
        env: { MODEL_STATUS: rejected }
        run: |
          python - <<'PY'
          import os, pathlib
          version=f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          metrics=pathlib.Path("artifacts/candidate/metrics.json").read_text().replace("'", "''")
          sql=f"INSERT INTO research_model_runs(version,status,artifact_key,metrics_json,created_at) VALUES('{version}','rejected','models/{version}','{metrics}',datetime('now')) ON CONFLICT(version) DO UPDATE SET status='rejected',metrics_json=excluded.metrics_json;"
          pathlib.Path("/tmp/model-audit.sql").write_text(sql)
          PY
          npx wrangler d1 execute DB --remote --file /tmp/model-audit.sql
