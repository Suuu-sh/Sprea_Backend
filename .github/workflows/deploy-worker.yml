name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: { group: deploy-worker, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run typecheck && npm test
      - run: npx wrangler d1 migrations apply DB --remote
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
      - uses: cloudflare/wrangler-action@v3
        with: { apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}", accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
